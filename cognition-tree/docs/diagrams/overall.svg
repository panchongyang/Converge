<!-- 由同名 .mmd 重绘；编辑图源后运行 pnpm run diagrams。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1072" viewBox="0 0 960 1072" role="img" aria-labelledby="title caption">
  <title id="title">认知树 MVP · 总体架构（目标设计）</title>
  <desc id="caption">DSH 与独立网页复用 UI 和业务内核</desc>
  <defs>
    <style>
    text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #142940; }
    .heading { font-size: 26px; font-weight: 700; }
    .caption { font-size: 16px; fill: #455d78; }
    .badge { font-size: 14px; font-weight: 600; fill: #285390; }
    .zone { fill: #f7f9fc; stroke: #cbd7e6; }
    .zone.ui { fill: #f3f7fd; stroke: #c1d3ed; }
    .zone.kernel { fill: #f4f7fb; stroke: #c6d4e5; }
    .zone.store { fill: #f3f9f7; stroke: #c1dad2; }
    .zone-title { font-size: 16px; font-weight: 600; fill: #365573; }
    .card { fill: #ffffff; stroke: #a4b6cc; stroke-width: 1.25; }
    .card.ui { fill: #e8f0ff; stroke: #8ba8d8; }
    .card.kernel { fill: #e7eef8; stroke: #93adcb; }
    .card.port { fill: #f1edfa; stroke: #a99acb; }
    .card.store { fill: #e6f3ef; stroke: #86b5a8; }
    .card.future { fill: #f8fafc; stroke: #8293ab; stroke-dasharray: 5 4; }
    .node-title { font-size: 18px; font-weight: 600; }
    .node-detail { font-size: 16px; fill: #405670; }
    .edge { fill: none; stroke: #526783; stroke-width: 1.8; stroke-linejoin: round; }
    .edge.dashed { stroke-dasharray: 5 4; }
    .edge-label { font-size: 14px; fill: #334e6c; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0.75 L 10 5 L 0 9.25 Z" fill="#526783"/>
    </marker>
  </defs>
  <rect width="960" height="1072" fill="#ffffff"/>
  <rect x="24" y="27" width="4" height="48" rx="2" fill="#376eb8"/>
  <text x="40" y="49" class="heading">认知树 MVP · 总体架构</text>
  <text x="40" y="74" class="caption">DSH 与独立网页复用 UI 和业务内核</text>
  <rect x="838" y="26" width="98" height="34" rx="17" fill="#eaf1fc"/>
  <text x="887" y="48" text-anchor="middle" class="badge">目标设计</text>
  <rect class="zone ui" x="24" y="96" width="912" height="362" rx="16"/>
  <text class="zone-title" x="44" y="126">用户入口 · 共用 UI</text>
  <rect class="zone kernel" x="24" y="470" width="912" height="578" rx="16"/>
  <text class="zone-title" x="44" y="500">后端路径</text>
  <polyline class="edge" data-from="HUMAN" data-to="PANEL" points="444,156 444,172 160,172 160,188" marker-end="url(#arrow)"/>
  <text class="edge-label" x="192" y="165" text-anchor="middle">打开</text>
  <polyline class="edge" data-from="HUMAN" data-to="WEB" points="516,156 516,172 800,172 800,188" marker-end="url(#arrow)"/>
  <text class="edge-label" x="768" y="165" text-anchor="middle">打开</text>
  <polyline class="edge" data-from="AGENT" data-to="TOOLS" points="154,550 154,584" marker-end="url(#arrow)"/>
  <text class="edge-label" x="166" y="572" text-anchor="start">工具调用</text>
  <polyline class="edge" data-from="PANEL" data-to="DSHC" points="160,242 160,276" marker-end="url(#arrow)"/>
  <text class="edge-label" x="172" y="264" text-anchor="start">装配</text>
  <polyline class="edge" data-from="WEB" data-to="BCL" points="800,242 800,276" marker-end="url(#arrow)"/>
  <text class="edge-label" x="812" y="264" text-anchor="start">装配</text>
  <polyline class="edge" data-from="DSHC" data-to="UI" points="276,309 360,309" marker-end="url(#arrow)"/>
  <text class="edge-label" x="318" y="282" text-anchor="middle">挂载同一</text>
  <text class="edge-label" x="318" y="300" text-anchor="middle">应用壳</text>
  <polyline class="edge" data-from="BCL" data-to="UI" points="684,309 600,309" marker-end="url(#arrow)"/>
  <text class="edge-label" x="642" y="282" text-anchor="middle">挂载同一</text>
  <text class="edge-label" x="642" y="300" text-anchor="middle">应用壳</text>
  <polyline class="edge" data-from="UI" data-to="PORT" points="480,342 480,386" marker-end="url(#arrow)"/>
  <text class="edge-label" x="492" y="369" text-anchor="start">调用端口</text>
  <polyline class="edge" data-from="DSHC" data-to="PORT" points="240,342 240,415 360,415" marker-end="url(#arrow)"/>
  <text class="edge-label" x="300" y="404" text-anchor="middle">实现端口</text>
  <polyline class="edge" data-from="BCL" data-to="PORT" points="720,342 720,415 600,415" marker-end="url(#arrow)"/>
  <text class="edge-label" x="660" y="404" text-anchor="middle">实现端口</text>
  <polyline class="edge" data-from="DSHC" data-to="SRV" points="182,342 182,498 404,498 404,584" marker-end="url(#arrow)"/>
  <text class="edge-label" x="292" y="488" text-anchor="middle">HTTP / JSON</text>
  <polyline class="edge" data-from="BCL" data-to="CAT" points="900,342 900,683 588,683 588,708" marker-end="url(#arrow)"/>
  <text class="edge-label" x="736" y="703" text-anchor="middle">同一操作目录，不经 DSH</text>
  <polyline class="edge" data-from="TOOLS" data-to="CAT" points="154,638 154,664 376,664 376,708" marker-end="url(#arrow)"/>
  <polyline class="edge" data-from="SRV" data-to="CAT" points="404,638 404,708" marker-end="url(#arrow)"/>
  <polyline class="edge" data-from="CAT" data-to="MODELS" points="480,758 480,794" marker-end="url(#arrow)"/>
  <text class="edge-label" x="494" y="781" text-anchor="start">按身份分派</text>
  <polyline class="edge" data-from="MODELS" data-to="STORE" points="480,844 480,880" marker-end="url(#arrow)"/>
  <text class="edge-label" x="494" y="867" text-anchor="start">持久化</text>
  <polyline class="edge" data-from="STORE" data-to="FS" points="410,930 410,959 181,959 181,980" marker-end="url(#arrow)"/>
  <text class="edge-label" x="293" y="948" text-anchor="middle">DSH 注入</text>
  <polyline class="edge" data-from="STORE" data-to="BS" points="550,930 550,959 779,959 779,980" marker-end="url(#arrow)"/>
  <text class="edge-label" x="667" y="948" text-anchor="middle">独立网页注入</text>
  <polyline class="edge dashed" data-from="MCP" data-to="CAT" points="728,638 728,669 540,669 540,708" marker-end="url(#arrow)"/>
  <text class="edge-label" x="630" y="659" text-anchor="middle">未来：接同一 catalog</text>
  <g data-node="HUMAN">
    <rect class="card " x="406" y="114" width="148" height="42" rx="9"/>
    <text class="node-title" x="480" y="141" text-anchor="middle">人</text>
  </g>
  <g data-node="AGENT">
    <rect class="card " x="44" y="508" width="220" height="42" rx="9"/>
    <text class="node-title" x="154" y="535" text-anchor="middle">DSH Agent</text>
  </g>
  <g data-node="PANEL">
    <rect class="card " x="44" y="188" width="232" height="54" rx="9"/>
    <text class="node-title" x="160" y="211.5" text-anchor="middle">DSH 侧栏主面板</text>
    <text class="node-detail" x="160" y="230.5" text-anchor="middle">/ 聊天提议卡</text>
  </g>
  <g data-node="WEB">
    <rect class="card " x="684" y="188" width="232" height="54" rx="9"/>
    <text class="node-title" x="800" y="221" text-anchor="middle">独立网页</text>
  </g>
  <g data-node="DSHC">
    <rect class="card " x="44" y="276" width="232" height="66" rx="9"/>
    <text class="node-title" x="160" y="305.5" text-anchor="middle">adapters/dsh/src/client</text>
    <text class="node-detail" x="160" y="324.5" text-anchor="middle">槽位注册 · HTTP · 宿主桥</text>
  </g>
  <g data-node="BCL">
    <rect class="card " x="684" y="276" width="232" height="66" rx="9"/>
    <text class="node-title" x="800" y="305.5" text-anchor="middle">adapters/browser</text>
    <text class="node-detail" x="800" y="324.5" text-anchor="middle">本地 client</text>
  </g>
  <g data-node="UI">
    <rect class="card ui" x="360" y="276" width="240" height="66" rx="9"/>
    <text class="node-title" x="480" y="296" text-anchor="middle">ui/src</text>
    <text class="node-detail" x="480" y="315" text-anchor="middle">共用应用壳</text>
    <text class="node-detail" x="480" y="334" text-anchor="middle">功能模块 · UI 模型</text>
  </g>
  <g data-node="PORT">
    <rect class="card port" x="360" y="386" width="240" height="58" rx="9"/>
    <text class="node-title" x="480" y="411.5" text-anchor="middle">ui/src/types</text>
    <text class="node-detail" x="480" y="430.5" text-anchor="middle">CognitionClient / HostBridge</text>
  </g>
  <g data-node="TOOLS">
    <rect class="card " x="44" y="584" width="220" height="54" rx="9"/>
    <text class="node-title" x="154" y="607.5" text-anchor="middle">dsh/src/server/host</text>
    <text class="node-detail" x="154" y="626.5" text-anchor="middle">AI 工具</text>
  </g>
  <g data-node="SRV">
    <rect class="card " x="288" y="584" width="232" height="54" rx="9"/>
    <text class="node-title" x="404" y="607.5" text-anchor="middle">dsh/src/server/host</text>
    <text class="node-detail" x="404" y="626.5" text-anchor="middle">人侧路由</text>
  </g>
  <g data-node="CAT">
    <rect class="card kernel" x="348" y="708" width="264" height="50" rx="9"/>
    <text class="node-title" x="480" y="739" text-anchor="middle">kernel/src/catalog</text>
  </g>
  <g data-node="MODELS">
    <rect class="card kernel" x="348" y="794" width="264" height="50" rx="9"/>
    <text class="node-title" x="480" y="825" text-anchor="middle">kernel/src/models</text>
  </g>
  <g data-node="STORE">
    <rect class="card port" x="348" y="880" width="264" height="50" rx="9"/>
    <text class="node-title" x="480" y="911" text-anchor="middle">TreeStore 契约</text>
  </g>
  <g data-node="FS">
    <rect class="card store" x="44" y="980" width="274" height="56" rx="9"/>
    <text class="node-title" x="181" y="1004.5" text-anchor="middle">工作区/.converge/</text>
    <text class="node-detail" x="181" y="1023.5" text-anchor="middle">单树 SQLite</text>
  </g>
  <g data-node="BS">
    <rect class="card store" x="642" y="980" width="274" height="56" rx="9"/>
    <text class="node-title" x="779" y="1004.5" text-anchor="middle">独立网页：内存索引</text>
    <text class="node-detail" x="779" y="1023.5" text-anchor="middle">localStorage 测试存储</text>
  </g>
  <g data-node="MCP">
    <rect class="card future" x="616" y="584" width="224" height="54" rx="9"/>
    <text class="node-title" x="728" y="607.5" text-anchor="middle">MCP 适配器</text>
    <text class="node-detail" x="728" y="626.5" text-anchor="middle">（未来，v1 不实现）</text>
  </g>
</svg>
