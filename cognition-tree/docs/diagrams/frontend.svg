<!-- 由同名 .mmd 重绘；编辑图源后运行 pnpm run diagrams。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="title caption">
  <title id="title">前端 · 两个壳共用 UI（目标设计，React 18）</title>
  <desc id="caption">DSH 与独立浏览器分别接线</desc>
  <defs>
    <style>
    text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #142940; }
    .heading { font-size: 26px; font-weight: 700; }
    .caption { font-size: 16px; fill: #455d78; }
    .badge { font-size: 14px; font-weight: 600; fill: #285390; }
    .zone { fill: #f7f9fc; stroke: #cbd7e6; }
    .zone.ui { fill: #f3f7fd; stroke: #c1d3ed; }
    .zone.kernel { fill: #f4f7fb; stroke: #c6d4e5; }
    .zone.store { fill: #f3f9f7; stroke: #c1dad2; }
    .zone-title { font-size: 16px; font-weight: 600; fill: #365573; }
    .card { fill: #ffffff; stroke: #a4b6cc; stroke-width: 1.25; }
    .card.ui { fill: #e8f0ff; stroke: #8ba8d8; }
    .card.kernel { fill: #e7eef8; stroke: #93adcb; }
    .card.port { fill: #f1edfa; stroke: #a99acb; }
    .card.store { fill: #e6f3ef; stroke: #86b5a8; }
    .card.future { fill: #f8fafc; stroke: #8293ab; stroke-dasharray: 5 4; }
    .node-title { font-size: 18px; font-weight: 600; }
    .node-detail { font-size: 16px; fill: #405670; }
    .edge { fill: none; stroke: #526783; stroke-width: 1.8; stroke-linejoin: round; }
    .edge.dashed { stroke-dasharray: 5 4; }
    .edge-label { font-size: 14px; fill: #334e6c; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0.75 L 10 5 L 0 9.25 Z" fill="#526783"/>
    </marker>
  </defs>
  <rect width="960" height="690" fill="#ffffff"/>
  <rect x="24" y="27" width="4" height="48" rx="2" fill="#376eb8"/>
  <text x="40" y="49" class="heading">前端 · 两个壳共用 UI</text>
  <text x="40" y="74" class="caption">DSH 与独立浏览器分别接线</text>
  <rect x="838" y="26" width="98" height="34" rx="17" fill="#eaf1fc"/>
  <text x="887" y="48" text-anchor="middle" class="badge">目标设计</text>
  <rect class="zone " x="24" y="96" width="196" height="298" rx="16"/>
  <text class="zone-title" x="44" y="126">DSH</text>
  <rect class="zone ui" x="242" y="96" width="476" height="482" rx="16"/>
  <text class="zone-title" x="262" y="126">ui/src · React 18</text>
  <rect class="zone " x="740" y="96" width="196" height="298" rx="16"/>
  <text class="zone-title" x="760" y="126">独立浏览器</text>
  <polyline class="edge" data-from="DSHC" data-to="APP" points="208,199 354,199" marker-end="url(#arrow)"/>
  <text class="edge-label" x="281" y="188" text-anchor="middle">装配</text>
  <polyline class="edge" data-from="SHELL" data-to="APP" points="752,199 606,199" marker-end="url(#arrow)"/>
  <text class="edge-label" x="679" y="188" text-anchor="middle">装配</text>
  <polyline class="edge" data-from="APP" data-to="MOD" points="480,238 480,274" marker-end="url(#arrow)"/>
  <polyline class="edge" data-from="MOD" data-to="MODEL" points="480,334 480,380" marker-end="url(#arrow)"/>
  <polyline class="edge" data-from="MOD" data-to="HOOK" points="404,334 404,354 320,354 320,380" marker-end="url(#arrow)"/>
  <polyline class="edge" data-from="MOD" data-to="CMP" points="556,334 556,354 640,354 640,380" marker-end="url(#arrow)"/>
  <polyline class="edge" data-from="MODEL" data-to="TYPES" points="480,450 480,496" marker-end="url(#arrow)"/>
  <text class="edge-label" x="494" y="478" text-anchor="start">依赖端口</text>
  <polyline class="edge" data-from="DSHC" data-to="TYPES" points="208,222 231,222 231,527 354,527" marker-end="url(#arrow)"/>
  <text class="edge-label" x="292" y="516" text-anchor="middle">实现端口</text>
  <polyline class="edge" data-from="BCL" data-to="TYPES" points="752,334 729,334 729,527 606,527" marker-end="url(#arrow)"/>
  <text class="edge-label" x="670" y="516" text-anchor="middle">实现端口</text>
  <polyline class="edge" data-from="DSHC" data-to="SERVER" points="126,238 126,298" marker-end="url(#arrow)"/>
  <text class="edge-label" x="140" y="271" text-anchor="start">HTTP</text>
  <polyline class="edge" data-from="BCL" data-to="KERNEL" points="834,370 834,606" marker-end="url(#arrow)"/>
  <text class="edge-label" x="849" y="497" text-anchor="start">同一真内核</text>
  <polyline class="edge dashed" data-from="TYPES" data-to="KERNEL" points="480,558 480,636 752,636" marker-end="url(#arrow)"/>
  <text class="edge-label" x="615" y="624" text-anchor="middle">只 import type</text>
  <g data-node="DSHC">
    <rect class="card " x="44" y="160" width="164" height="78" rx="9"/>
    <text class="node-title" x="126" y="186" text-anchor="middle">DSH client</text>
    <text class="node-detail" x="126" y="205" text-anchor="middle">槽位注册</text>
    <text class="node-detail" x="126" y="224" text-anchor="middle">HTTP · 宿主桥</text>
  </g>
  <g data-node="SHELL">
    <rect class="card " x="752" y="160" width="164" height="78" rx="9"/>
    <text class="node-title" x="834" y="195.5" text-anchor="middle">独立网页入口</text>
    <text class="node-detail" x="834" y="214.5" text-anchor="middle">browser</text>
  </g>
  <g data-node="APP">
    <rect class="card ui" x="354" y="160" width="252" height="78" rx="9"/>
    <text class="node-title" x="480" y="195.5" text-anchor="middle">app</text>
    <text class="node-detail" x="480" y="214.5" text-anchor="middle">共用应用壳</text>
  </g>
  <g data-node="MOD">
    <rect class="card ui" x="354" y="274" width="252" height="60" rx="9"/>
    <text class="node-title" x="480" y="300.5" text-anchor="middle">modules</text>
    <text class="node-detail" x="480" y="319.5" text-anchor="middle">树阅读 · 节点详情 · 变更与确认</text>
  </g>
  <g data-node="MODEL">
    <rect class="card ui" x="398" y="380" width="164" height="70" rx="9"/>
    <text class="node-title" x="480" y="402" text-anchor="middle">models</text>
    <text class="node-detail" x="480" y="421" text-anchor="middle">选中 · 展开</text>
    <text class="node-detail" x="480" y="440" text-anchor="middle">未提交输入</text>
  </g>
  <g data-node="HOOK">
    <rect class="card ui" x="258" y="380" width="124" height="70" rx="9"/>
    <text class="node-title" x="320" y="411.5" text-anchor="middle">hooks</text>
    <text class="node-detail" x="320" y="430.5" text-anchor="middle">通用交互</text>
  </g>
  <g data-node="CMP">
    <rect class="card ui" x="578" y="380" width="124" height="70" rx="9"/>
    <text class="node-title" x="640" y="411.5" text-anchor="middle">components</text>
    <text class="node-detail" x="640" y="430.5" text-anchor="middle">通用原子件</text>
  </g>
  <g data-node="TYPES">
    <rect class="card port" x="354" y="496" width="252" height="62" rx="9"/>
    <text class="node-title" x="480" y="523.5" text-anchor="middle">types</text>
    <text class="node-detail" x="480" y="542.5" text-anchor="middle">CognitionClient / HostBridge</text>
  </g>
  <g data-node="BCL">
    <rect class="card " x="752" y="298" width="164" height="72" rx="9"/>
    <text class="node-title" x="834" y="330.5" text-anchor="middle">browser</text>
    <text class="node-detail" x="834" y="349.5" text-anchor="middle">本地 client</text>
  </g>
  <g data-node="SERVER">
    <rect class="card " x="44" y="298" width="164" height="72" rx="9"/>
    <text class="node-title" x="126" y="330.5" text-anchor="middle">adapters/dsh/</text>
    <text class="node-detail" x="126" y="349.5" text-anchor="middle">src/server</text>
  </g>
  <g data-node="KERNEL">
    <rect class="card kernel" x="752" y="606" width="164" height="60" rx="9"/>
    <text class="node-title" x="834" y="642" text-anchor="middle">kernel/src</text>
  </g>
</svg>
