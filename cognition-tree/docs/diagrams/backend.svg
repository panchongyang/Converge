<!-- 由同名 .mmd 重绘；编辑图源后运行 pnpm run diagrams。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="866" viewBox="0 0 960 866" role="img" aria-labelledby="title caption">
  <title id="title">后端与内核 · 调用顺序（目标设计）</title>
  <desc id="caption">规则、写入与 I/O 的边界</desc>
  <defs>
    <style>
    text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #142940; }
    .heading { font-size: 26px; font-weight: 700; }
    .caption { font-size: 16px; fill: #455d78; }
    .badge { font-size: 14px; font-weight: 600; fill: #285390; }
    .zone { fill: #f7f9fc; stroke: #cbd7e6; }
    .zone.ui { fill: #f3f7fd; stroke: #c1d3ed; }
    .zone.kernel { fill: #f4f7fb; stroke: #c6d4e5; }
    .zone.store { fill: #f3f9f7; stroke: #c1dad2; }
    .zone-title { font-size: 16px; font-weight: 600; fill: #365573; }
    .card { fill: #ffffff; stroke: #a4b6cc; stroke-width: 1.25; }
    .card.ui { fill: #e8f0ff; stroke: #8ba8d8; }
    .card.kernel { fill: #e7eef8; stroke: #93adcb; }
    .card.port { fill: #f1edfa; stroke: #a99acb; }
    .card.store { fill: #e6f3ef; stroke: #86b5a8; }
    .card.future { fill: #f8fafc; stroke: #8293ab; stroke-dasharray: 5 4; }
    .node-title { font-size: 18px; font-weight: 600; }
    .node-detail { font-size: 16px; fill: #405670; }
    .edge { fill: none; stroke: #526783; stroke-width: 1.8; stroke-linejoin: round; }
    .edge.dashed { stroke-dasharray: 5 4; }
    .edge-label { font-size: 14px; fill: #334e6c; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0.75 L 10 5 L 0 9.25 Z" fill="#526783"/>
    </marker>
  </defs>
  <rect width="960" height="866" fill="#ffffff"/>
  <rect x="24" y="27" width="4" height="48" rx="2" fill="#376eb8"/>
  <text x="40" y="49" class="heading">后端与内核 · 调用顺序</text>
  <text x="40" y="74" class="caption">规则、写入与 I/O 的边界</text>
  <rect x="838" y="26" width="98" height="34" rx="17" fill="#eaf1fc"/>
  <text x="887" y="48" text-anchor="middle" class="badge">目标设计</text>
  <rect class="zone " x="24" y="96" width="912" height="198" rx="16"/>
  <text class="zone-title" x="44" y="126">DSH 服务端</text>
  <rect class="zone kernel" x="24" y="318" width="912" height="412" rx="16"/>
  <text class="zone-title" x="44" y="348">业务内核 · kernel/src</text>
  <rect class="zone store" x="24" y="752" width="912" height="90" rx="16"/>
  <text class="zone-title" x="44" y="782">工作区存储</text>
  <polyline class="edge" data-from="TOOLS" data-to="WIRE" points="336,182 336,201 420,201 420,224" marker-end="url(#arrow)"/>
  <polyline class="edge" data-from="ROUTES" data-to="WIRE" points="624,182 624,201 540,201 540,224" marker-end="url(#arrow)"/>
  <polyline class="edge" data-from="WIRE" data-to="CAT" points="480,278 480,342" marker-end="url(#arrow)"/>
  <text class="edge-label" x="494" y="311" text-anchor="start">actor + 请求</text>
  <polyline class="edge" data-from="CAT" data-to="MODELS" points="480,396 480,432" marker-end="url(#arrow)"/>
  <text class="edge-label" x="494" y="419" text-anchor="start">分派用例</text>
  <polyline class="edge" data-from="MODELS" data-to="CMD" points="398,490 398,518 180,518 180,558" marker-end="url(#arrow)"/>
  <text class="edge-label" x="289" y="507" text-anchor="middle">提交：校验意图</text>
  <polyline class="edge" data-from="CMD" data-to="OPS" points="180,616 180,652" marker-end="url(#arrow)"/>
  <text class="edge-label" x="194" y="640" text-anchor="start">显式变更</text>
  <polyline class="edge" data-from="CAT" data-to="QRY" points="604,396 632,414 632,536 544,536 544,558" marker-end="url(#arrow)"/>
  <text class="edge-label" x="588" y="552" text-anchor="middle">只读用例</text>
  <polyline class="edge" data-from="QRY" data-to="PORT" points="604,590 656,590" marker-end="url(#arrow)"/>
  <text class="edge-label" x="632" y="612" text-anchor="middle">开快照</text>
  <polyline class="edge" data-from="MODELS" data-to="PORT" points="562,490 562,518 780,518 780,558" marker-end="url(#arrow)"/>
  <text class="edge-label" x="671" y="507" text-anchor="middle">持久化</text>
  <polyline class="edge" data-from="PORT" data-to="FS" points="780,616 780,768" marker-end="url(#arrow)"/>
  <text class="edge-label" x="794" y="697" text-anchor="start">注入的实现</text>
  <g data-node="TOOLS">
    <rect class="card " x="234" y="130" width="204" height="52" rx="9"/>
    <text class="node-title" x="336" y="162" text-anchor="middle">入口：dsh tools</text>
  </g>
  <g data-node="WIRE">
    <rect class="card " x="348" y="224" width="264" height="54" rx="9"/>
    <text class="node-title" x="480" y="247.5" text-anchor="middle">可信工作区与 actor</text>
    <text class="node-detail" x="480" y="266.5" text-anchor="middle">首次调用启动工作线程</text>
  </g>
  <g data-node="ROUTES">
    <rect class="card " x="522" y="130" width="204" height="52" rx="9"/>
    <text class="node-title" x="624" y="162" text-anchor="middle">入口：dsh routes</text>
  </g>
  <g data-node="CAT">
    <rect class="card kernel" x="348" y="342" width="264" height="54" rx="9"/>
    <text class="node-title" x="480" y="365.5" text-anchor="middle">catalog</text>
    <text class="node-detail" x="480" y="384.5" text-anchor="middle">按身份取子集</text>
  </g>
  <g data-node="MODELS">
    <rect class="card kernel" x="348" y="432" width="264" height="58" rx="9"/>
    <text class="node-title" x="480" y="457.5" text-anchor="middle">models</text>
    <text class="node-detail" x="480" y="476.5" text-anchor="middle">唯一写入口</text>
  </g>
  <g data-node="CMD">
    <rect class="card kernel" x="56" y="558" width="248" height="58" rx="9"/>
    <text class="node-title" x="180" y="583.5" text-anchor="middle">commands</text>
    <text class="node-detail" x="180" y="602.5" text-anchor="middle">树语义</text>
  </g>
  <g data-node="OPS">
    <rect class="card kernel" x="56" y="652" width="248" height="58" rx="9"/>
    <text class="node-title" x="180" y="677.5" text-anchor="middle">operations</text>
    <text class="node-detail" x="180" y="696.5" text-anchor="middle">纯变更原语</text>
  </g>
  <g data-node="QRY">
    <rect class="card kernel" x="356" y="558" width="248" height="58" rx="9"/>
    <text class="node-title" x="480" y="583.5" text-anchor="middle">queries</text>
    <text class="node-detail" x="480" y="602.5" text-anchor="middle">读投影</text>
  </g>
  <g data-node="PORT">
    <rect class="card port" x="656" y="558" width="248" height="58" rx="9"/>
    <text class="node-title" x="780" y="593" text-anchor="middle">TreeStore 契约</text>
  </g>
  <g data-node="FS">
    <rect class="card store" x="656" y="768" width="248" height="58" rx="9"/>
    <text class="node-title" x="780" y="793.5" text-anchor="middle">工作区/.converge/</text>
    <text class="node-detail" x="780" y="812.5" text-anchor="middle">每树一个 SQLite 主库</text>
  </g>
</svg>
